[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-data-structures"
version = "1.0.0"
description = "Classic data structures and sorting algorithms written from scratch, typed and property-tested."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lucas Accioly" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "hypothesis>=6.170,<7", "ruff>=0.17.5,<0.18", "mypy>=2.4,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsa"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "examples", "tests"]
mypy_path = "src"
